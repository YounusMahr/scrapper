name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone repo if it doesn't exist
            if [ ! -d "/home/${{ secrets.EC2_USERNAME }}/scrapper/.git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/YounusMahr/scrapper.git /home/${{ secrets.EC2_USERNAME }}/scrapper
            fi

            cd /home/${{ secrets.EC2_USERNAME }}/scrapper

            # Pull latest code
            echo "Pulling latest code..."
            git pull origin main

            # Install Nginx if not installed
            echo "Checking Nginx..."
            if ! command -v nginx &> /dev/null; then
                echo "Installing Nginx..."
                sudo apt update
                sudo apt install nginx -y
                sudo systemctl start nginx
                sudo systemctl enable nginx
            fi

            # Install Certbot if not installed
            echo "Checking Certbot..."
            if ! command -v certbot &> /dev/null; then
                echo "Installing Certbot..."
                sudo apt install certbot python3-certbot-nginx -y
            fi

            # Stop existing containers
            echo "Stopping old containers..."
            docker stop lead-scraper || true
            docker rm lead-scraper || true
            docker stop lead-scraper-redis || true
            docker rm lead-scraper-redis || true

            # Remove old image
            docker rmi lead-scraper:latest || true

            # Create .env file from secrets
            echo "Creating .env file..."
            printf "%s\n" \
              "PORT=5000" \
              "MONGODB_URI=${{ secrets.MONGODB_URI }}" \
              "REDIS_HOST=lead-scraper-redis" \
              "REDIS_PORT=6379" \
              "PROXY_LIST=" > .env

            # Build new image
            echo "Building Docker image..."
            docker build -t lead-scraper:latest .

            # Start Redis
            echo "Starting Redis..."
            docker run -d \
              --name lead-scraper-redis \
              --restart always \
              -p 6379:6379 \
              redis:7-alpine

            # Start the app
            echo "Starting Lead Scraper..."
            docker run -d \
              --name lead-scraper \
              --restart always \
              -p 5000:5000 \
              --link lead-scraper-redis:redis \
              -e REDIS_HOST=lead-scraper-redis \
              --env-file .env \
              lead-scraper:latest

            # Setup Nginx
            echo "Configuring Nginx..."
            sudo mkdir -p /var/www/certbot
            sudo cp nginx/scrapper.zentraai.tech.conf.http-only /etc/nginx/sites-available/scrapper.zentraai.tech
            sudo ln -sf /etc/nginx/sites-available/scrapper.zentraai.tech /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

            # Setup SSL with Certbot (only if not already set up)
            echo "Setting up SSL..."
            if [ ! -d /etc/letsencrypt/live/scrapper.zentraai.tech ]; then
                sudo certbot --nginx -d scrapper.zentraai.tech --non-interactive --agree-tos --email admin@zentraai.tech
            else
                echo "SSL already configured. Renewing..."
                sudo certbot renew --quiet
            fi

            # Auto-renewal cron job
            echo "0 0,12 * * * root certbot renew --quiet" | sudo tee /etc/cron.d/certbot-renew > /dev/null

            # Clean up
            docker image prune -f

            # Verify
            echo ""
            echo "=========================================="
            echo "  Checking containers..."
            echo "=========================================="
            docker ps

            echo ""
            echo "=========================================="
            echo "  Deployment Complete!"
            echo "  https://scrapper.zentraai.tech"
            echo "=========================================="
