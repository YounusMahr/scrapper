name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone repo if it doesn't exist
            if [ ! -d "/home/${{ secrets.EC2_USERNAME }}/scrapper/.git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/YounusMahr/scrapper.git /home/${{ secrets.EC2_USERNAME }}/scrapper
            fi

            cd /home/${{ secrets.EC2_USERNAME }}/scrapper

            # Pull latest code
            echo "Pulling latest code..."
            git pull origin main

            # Install Nginx if not installed
            echo "Checking Nginx..."
            if ! command -v nginx &> /dev/null; then
                echo "Installing Nginx..."
                sudo apt update
                sudo apt install nginx -y
                sudo systemctl start nginx
                sudo systemctl enable nginx
            fi

            # Install Certbot if not installed
            echo "Checking Certbot..."
            if ! command -v certbot &> /dev/null; then
                echo "Installing Certbot..."
                sudo apt install certbot python3-certbot-nginx -y
            fi

            # Stop existing containers
            echo "Stopping old containers..."
            docker stop lead-scraper || true
            docker rm lead-scraper || true

            # Remove old image
            docker rmi lead-scraper:latest || true

            # Create .env file from secrets
            echo "Creating .env file..."
            printf "%s\n" \
              "PORT=5000" \
              "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "PROXY_LIST=${{ secrets.PROXY_LIST }}" > .env

            # Build new image
            echo "Building Docker image..."
            docker build -t lead-scraper:latest .

            # Start the app (attaching to syncboard_default network if it exists)
            echo "Starting Lead Scraper..."
            NET_FLAG=""
            if docker network inspect syncboard_default &>/dev/null; then
              echo "Network syncboard_default detected. Attaching container..."
              NET_FLAG="--network syncboard_default"
            fi

            docker run -d \
              --name lead-scraper \
              --restart always \
              $NET_FLAG \
              -p 5000:5000 \
              --env-file .env \
              lead-scraper:latest

            # Host-level Nginx setup is bypassed because the user runs containerized nginx-proxy
            echo "Nginx proxy configuration should be handled inside the containerized nginx-proxy (syncboard)."

            # Clean up
            docker image prune -f

            # Verify
            echo ""
            echo "=========================================="
            echo "  Checking containers..."
            echo "=========================================="
            docker ps

            echo ""
            echo "=========================================="
            echo "  Deployment Complete!"
            echo "  https://scrapper.zentraai.tech"
            echo "=========================================="
