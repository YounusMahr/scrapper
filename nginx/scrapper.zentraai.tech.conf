# =========================
# TASK MANAGER (MAIN APP)
# =========================
server {
    listen 80;
    server_name mern-app.zentraai.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mern-app.zentraai.tech;

    ssl_certificate /etc/letsencrypt/live/mern-app.zentraai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mern-app.zentraai.tech/privkey.pem;

    location / {
        proxy_pass http://client:80;
    }

    location /api {
        proxy_pass http://server:5000;
    }

    location /socket.io/ {
        proxy_pass http://server:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

# =========================
# SCRAPPER APP
# =========================
server {
    listen 80;
    server_name scrapper.zentraai.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name scrapper.zentraai.tech;

    ssl_certificate /etc/letsencrypt/live/scrapper.zentraai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrapper.zentraai.tech/privkey.pem;

    location / {
        proxy_pass http://lead-scraper:5000;
    }
}
